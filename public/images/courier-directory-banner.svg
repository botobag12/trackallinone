<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="500" fill="#F5EFE0"/>
  <!-- subtle background shapes -->
  <circle cx="1380" cy="120" r="150" fill="#EDE5D0"/>
  <circle cx="1480" cy="60" r="60" fill="#E7DDC4"/>

  <!-- Brand text -->
  <text x="80" y="235" font-family="'Arial Black', Helvetica, Arial, sans-serif" font-size="122" font-weight="900" letter-spacing="-3" fill="#2B2B2B">track<tspan fill="#8B1A1A">all</tspan>in<tspan fill="#8B1A1A">one</tspan></text>
  <rect x="86" y="268" width="120" height="8" rx="4" fill="#8B1A1A"/>
  <text x="86" y="320" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="2" fill="#2B2B2B" opacity="0.8">Every courier. Every parcel. One place.</text>

  <!-- Speed lines -->
  <g stroke="#B9AD92" stroke-width="6" stroke-linecap="round">
    <line x1="960" y1="262" x2="1020" y2="262"/>
    <line x1="930" y1="296" x2="1020" y2="296"/>
    <line x1="975" y1="330" x2="1020" y2="330"/>
  </g>

  <!-- Road -->
  <rect x="0" y="368" width="1600" height="132" fill="#2B2B2B"/>
  <rect x="0" y="368" width="1600" height="6" fill="#8B1A1A"/>
  <line x1="0" y1="445" x2="1600" y2="445" stroke="#F5EFE0" stroke-width="7" stroke-dasharray="70 45"/>
  <line x1="0" y1="486" x2="1600" y2="486" stroke="#F5EFE0" stroke-width="3" opacity="0.5"/>

  <!-- Truck -->
  <g>
    <!-- trailer -->
    <rect x="1040" y="222" width="290" height="148" rx="10" fill="#8B1A1A"/>
    <rect x="1040" y="300" width="290" height="10" fill="#F5EFE0"/>
    <!-- location pin on trailer -->
    <path d="M1185 272 c-14 0 -25 11 -25 25 c0 18 25 40 25 40 s25 -22 25 -40 c0 -14 -11 -25 -25 -25z" fill="#F5EFE0" transform="translate(0,-40) scale(1) translate(0,0)" opacity="0"/>
    <g transform="translate(1185 262)">
      <path d="M0 -26 c-14 0 -24 10 -24 24 c0 17 24 38 24 38 s24 -21 24 -38 c0 -14 -10 -24 -24 -24z" fill="#F5EFE0" transform="scale(0.85) translate(0,-8)"/>
      <circle cx="0" cy="-26" r="8" fill="#8B1A1A"/>
    </g>
    <!-- chassis -->
    <rect x="1040" y="366" width="440" height="14" fill="#1A1A1A"/>
    <!-- cab -->
    <polygon points="1340,262 1425,262 1475,322 1475,370 1340,370" fill="#2B2B2B" stroke="#F5EFE0" stroke-width="3"/>
    <polygon points="1358,278 1414,278 1452,322 1358,322" fill="#F5EFE0"/>
    <rect x="1462" y="338" width="14" height="16" rx="3" fill="#F5EFE0"/>
    <rect x="1340" y="318" width="6" height="52" fill="#8B1A1A"/>
    <!-- wheels -->
    <g fill="#111" stroke="#F5EFE0" stroke-width="4">
      <circle cx="1110" cy="376" r="30"/>
      <circle cx="1190" cy="376" r="30"/>
      <circle cx="1405" cy="376" r="30"/>
    </g>
    <g fill="#8B1A1A">
      <circle cx="1110" cy="376" r="10"/>
      <circle cx="1190" cy="376" r="10"/>
      <circle cx="1405" cy="376" r="10"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
